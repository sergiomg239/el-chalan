<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c1a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Chalán: El Legado — Preview v7</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;600;700&family=Caveat:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root{
    --brown:#432919; --brown-deep:#2c1a10;
    --red:#E40C2C; --khaki:#CEC988;
    --teal:#28ACAD; --teal-deep:#1c8586;
    --cream:#F4F1E6; --gold:#D9A93B;
  }
  body {
    margin: 0; background: var(--brown-deep);
    font-family: 'Nunito', sans-serif; color: var(--brown);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 10px 40px;
  }
  .titlefont{ font-family:'Baloo 2', cursive; font-weight:800; }
  .pillfont{ font-family:'Fredoka', sans-serif; font-weight:600; }
  .handfont{ font-family:'Caveat', cursive; font-weight:700; }
  #wrap {
    width: 820px; max-width: 100%; border-radius: 20px; overflow: hidden;
    box-shadow: 0 12px 0 var(--brown-deep), 0 12px 24px rgba(0,0,0,0.45);
    background: var(--cream);
  }
  #topbar{
    background: repeating-linear-gradient(45deg, var(--teal) 0 20px, var(--teal-deep) 20px 40px);
    padding: 10px 18px; display:flex; justify-content:space-between; align-items:center;
    border-bottom: 4px solid var(--brown);
  }
  #topbar .brand{ display:flex; align-items:center; gap:9px; color:#fff; }
  #topbar .joystick{ font-size:23px; }
  #topbar .brandtext{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  #topbar .gamerpill{ background:var(--red); color:#fff; font-family:'Baloo 2',cursive; font-size:9px; font-weight:800; padding:1px 9px; border-radius:8px; letter-spacing:0.5px; }
  #topbar .brandname{ font-style:italic; letter-spacing:0.3px; }
  #hud{ display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.25); padding:5px 10px; border-radius:20px; flex-wrap:wrap; }
  #hud .item{ display:flex; align-items:center; gap:5px; color:#fff; font-weight:800; font-size:12px; }
  .heart{ color:#ff8fa3; }
  .heart.off{ color:rgba(255,255,255,0.25); }

  #stage{ position:relative; background: var(--cream); }
  canvas{ display:block; width:100%; height:auto; background: linear-gradient(#bfe7e6,#eef7ef); }

  .caption-pill{
    background:#fff; border:3px solid var(--teal); border-radius:999px;
    padding:6px 16px; font-size:13px; color:var(--brown); display:inline-block;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }

  #screen{
    position:absolute; inset:0; background: rgba(67,41,25,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:20px; overflow-y:auto;
  }
  #screen.hidden{ display:none; }
  #screen h1{ color:#fff; font-size:32px; margin:0; text-shadow: 3px 3px 0 var(--red); }
  #screen h1.small{ font-size:22px; }
  #screen .hand{ color:var(--khaki); font-size:28px; margin:-6px 0 4px; }
  #screen p{ color:var(--khaki); font-size:13px; max-width:560px; line-height:1.7; margin:0; font-weight:700;}
  #screen .medal{ font-size:44px; line-height:1; margin:0; }
  #screen .medalname{ color:#fff; font-family:'Baloo 2',cursive; font-size:20px; margin:-4px 0 0; }
  #screen .record{ color:var(--gold); font-family:'Baloo 2',cursive; font-size:15px; }

  .rowcards{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:660px; }
  .charcard, .modecard, .levelcard{
    background:var(--cream); border:3px solid var(--brown); border-radius:14px;
    padding:8px 6px; cursor:pointer; text-align:center;
  }
  .charcard{ width:110px; }
  .charcard.selected, .modecard.selected, .levelcard.selected{ border-color:var(--red); box-shadow:0 0 0 3px var(--khaki); }
  .charcard canvas{ width:60px; height:60px; background:transparent; }
  .charcard .cname{ font-size:10px; font-weight:800; color:var(--brown); margin-top:4px; line-height:1.3; font-family:'Baloo 2', cursive; }

  .modecard{ width:210px; padding:14px 10px; }
  .modecard .micon{ font-size:34px; }
  .modecard .mname{ font-family:'Baloo 2',cursive; font-size:16px; color:var(--brown); font-weight:800; margin-top:4px;}
  .modecard .mdesc{ font-size:11px; color:#5f4936; margin-top:4px; font-weight:700; line-height:1.5; }

  .levelcards{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:660px; }
  .levelcard{ width:150px; padding:12px 8px; }
  .levelcard .lname{ font-family:'Baloo 2',cursive; font-size:13px; color:var(--brown); font-weight:800; }
  .levelcard .ldesc{ font-size:10px; color:#5f4936; margin-top:4px; font-weight:700; }
  .levelcard .stars{ color:var(--red); font-size:13px; margin-top:6px; }
  .levelcard .stars .off{ color:#d8cfc0; }
  .levelcard .best{ font-size:10px; color:var(--teal-deep); margin-top:4px; font-weight:800; }

  button.pixel{
    font-family:'Baloo 2', cursive; background: var(--red); color:#fff; border:none;
    border-bottom:4px solid #9c0a20; border-radius: 12px; padding:12px 26px;
    font-size:15px; cursor:pointer; font-weight:800;
  }
  button.pixel:active{ transform: translateY(3px); border-bottom-width:1px; }
  button.pixel.teal{ background: var(--teal); border-bottom-color: var(--teal-deep); }
  button.pixel.ghost{ background:transparent; color:var(--khaki); border:2px solid var(--khaki); border-bottom:2px solid var(--khaki); padding:9px 18px; font-size:12px; }

  #msg{ text-align:center; font-size:12px; color:var(--brown); padding:10px 8px 2px; font-weight:700; background:var(--khaki); }

  #controls{ display:flex; justify-content:center; align-items:center; gap:26px; padding:14px; background:var(--cream); }
  .dpad{ display:grid; grid-template-columns:54px 54px 54px; grid-template-rows:50px 50px; gap:4px; }
  .dpad button{
    font-family:'Baloo 2',cursive; font-size:16px;
    background: var(--brown); color:var(--khaki); border:none; border-bottom:4px solid var(--brown-deep); border-radius:10px;
  }
  .dpad button:active{ transform:translateY(3px); border-bottom-width:1px; }
  #btnUp{ grid-column:2; grid-row:1; }
  #btnLeft{ grid-column:1; grid-row:2; }
  #btnDown{ grid-column:2; grid-row:2; }
  #btnRight{ grid-column:3; grid-row:2; }
  #btnJump{
    width:74px; height:74px; border-radius:50%; font-family:'Baloo 2',cursive; font-size:13px;
    background: var(--red); color:#fff; border:none; border-bottom:5px solid #9c0a20;
  }
  #btnJump:active{ transform:translateY(3px); border-bottom-width:1px; }
  .hide{ display:none !important; }

  #soundBtn{
    position:absolute; top:14px; right:14px; z-index:5;
    background:rgba(0,0,0,0.35); color:#fff; border:2px solid #fff;
    border-radius:999px; width:38px; height:38px; font-size:16px; cursor:pointer;
  }

  /* Adaptación web móvil: el juego sigue siendo un único HTML y no requiere app nativa. */
  html, body { width:100%; min-height:100%; }
  body { overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  button, .charcard, .modecard, .levelcard { touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  @media (max-width: 700px) {
    body { padding:0; background:var(--brown-deep); }
    #wrap { width:100%; max-width:none; min-height:100dvh; border-radius:0; box-shadow:none; }
    #topbar { padding:8px 10px; min-height:54px; }
    #topbar .brandname { font-size:17px !important; }
    #topbar .joystick { font-size:20px; }
    #hud { gap:7px; padding:4px 7px; }
    #hud .item { font-size:10px; gap:3px; }
    #stage { width:100%; }
    canvas { width:100%; height:auto; }
    #screen { gap:10px; padding:14px 10px; }
    #screen h1 { font-size:clamp(24px,7vw,32px); }
    #screen .hand { font-size:clamp(21px,6vw,28px); }
    #screen p { font-size:12px; line-height:1.45; max-width:94vw; }
    .rowcards, .levelcards { gap:7px; max-width:96vw; }
    .charcard { width:82px; padding:6px 4px; }
    .charcard canvas { width:50px; height:50px; }
    .charcard .cname { font-size:9px; }
    .modecard { width:30vw; min-width:92px; max-width:150px; padding:9px 6px; }
    .modecard .micon { font-size:27px; }
    .modecard .mname { font-size:13px; }
    .modecard .mdesc { font-size:9px; line-height:1.25; }
    .levelcard { width:28vw; min-width:88px; max-width:130px; padding:8px 5px; }
    .levelcard .lname { font-size:11px; }
    .levelcard .ldesc, .levelcard .best { font-size:9px; }
    button.pixel { padding:10px 20px; font-size:14px; }
    #msg { font-size:10px; padding:7px 6px 3px; }
    #controls { gap:clamp(18px,8vw,55px); padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }
    .dpad { grid-template-columns:clamp(48px,14vw,60px) clamp(48px,14vw,60px) clamp(48px,14vw,60px); grid-template-rows:clamp(44px,13vw,54px) clamp(44px,13vw,54px); }
    #btnJump { width:clamp(68px,20vw,82px); height:clamp(68px,20vw,82px); }
    #soundBtn { top:9px; right:9px; width:34px; height:34px; }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding:0; }
    #topbar { min-height:46px; padding:5px 9px; }
    #topbar .brandname { font-size:15px !important; }
    #topbar .gamerpill { display:none; }
    #controls { padding:5px 10px calc(5px + env(safe-area-inset-bottom)); }
    .dpad { grid-template-columns:46px 46px 46px; grid-template-rows:40px 40px; }
    #btnJump { width:62px; height:62px; }
    #msg { display:none; }
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="topbar">
    <div class="brand">
      <span class="joystick">🕹️</span>
      <span class="brandtext">
        <span class="titlefont brandname" style="font-size:19px; line-height:1;">El Chalán</span>
        <span class="gamerpill">GAMER</span>
      </span>
    </div>
    <div id="hud">
      <div class="item" id="hearts"></div>
      <div class="item" id="itemCoinsWrap">🍦 <span id="coins">0</span></div>
      <div class="item">⭐ <span id="score">0</span></div>
      <div class="item">⏱ <span id="timer">0:00</span></div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="360"></canvas>
    <button id="soundBtn" title="Silenciar/activar sonido">🔊</button>
    <div id="screen"></div>
  </div>
  <div id="msg">Flechas / A-D para moverte · Espacio salta (Plataformas) · ↑/↓ trepa o navega (Escalada / Laberinto)</div>
  <div id="controls">
    <div class="dpad">
      <button id="btnUp">▲</button>
      <button id="btnLeft">◀</button>
      <button id="btnDown">▼</button>
      <button id="btnRight">▶</button>
    </div>
    <button id="btnJump">SALTAR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 48;
const CONFETTI_COLORS = ['#E40C2C','#28ACAD','#CEC988','#F4F1E6','#E85FA0','#D9A93B'];

// ================= PERSISTENCIA (mejores puntajes y pistas ya vistas) =================
function lsGet(key, fallback){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
let hintsSeen = lsGet('elchalan_hints', {});
function markHintSeen(id){ hintsSeen[id]=true; lsSet('elchalan_hints', hintsSeen); }
function loadBest(mode,tier){ return lsGet(`elchalan_best_${mode}_${tier}`, null); }
function saveBest(mode,tier,data){ lsSet(`elchalan_best_${mode}_${tier}`, data); }

// ================= SONIDO (sintetizado, sin audio con derechos de autor) =================
let actx = null, soundOn = true;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(freq, dur, type='square', vol=0.16, delay=0, slideTo=null){
  if(!soundOn) return;
  ensureAudio(); if(!actx) return;
  const t0 = actx.currentTime + delay;
  const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.linearRampToValueAtTime(slideTo, t0+dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
const sfx = {
  jump: ()=>tone(320,0.12,'square',0.16,0,640),
  coin: ()=>{ tone(880,0.07,'square',0.14,0); tone(1318,0.11,'square',0.14,0.07); },
  hit:  ()=>tone(170,0.25,'sawtooth',0.18,0,55),
  win:  ()=>[523,659,784,1047,1318].forEach((f,i)=>tone(f,0.16,'square',0.17,i*0.11)),
  lose: ()=>[392,349,311,262].forEach((f,i)=>tone(f,0.22,'sawtooth',0.14,i*0.15)),
  select:()=>tone(600,0.06,'square',0.12,0),
  climb: ()=>tone(240,0.05,'triangle',0.07,0),
  dot:   ()=>tone(1000,0.04,'square',0.09,0),
  pop:   ()=>{ tone(200,0.05,'square',0.2,0,900); tone(150,0.15,'sawtooth',0.12,0.04); },
  splat: ()=>tone(220,0.12,'sawtooth',0.14,0,110),
  bell:  ()=>{ tone(1600,0.35,'sine',0.15,0); tone(2000,0.3,'sine',0.11,0.05); },
};
document.getElementById('soundBtn').onclick = ()=>{
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) ensureAudio();
};

// ================= MÚSICA DE FONDO (loops originales sintetizados, sin derechos de autor) =================
const NOTE = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
               C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, C6:1046.50 };

const MUSIC_TRACKS = {
  platform: { bpm:132, wave:'triangle',
    notes:['E5','G5','A5','G5','E5','D5','C5','D5','E5','G5','A5','C6','A5','G5','E5','D5'] },
  climb: { bpm:150, wave:'triangle',
    notes:['C4','C4','G4','C4','C4','C4','A4','C4','C4','C4','G4','C4','C4','C4','E4','C4'],
    accent:['E5',null,null,null,'D5',null,null,null,'C5',null,null,null,'D5',null,null,null] },
  maze: { bpm:112, wave:'sine',
    notes:['A4','C5','E5','D5','C5','A4','G4','A4','A4','C5','E5','G5','E5','D5','C5','A4'] },
};

let musicTimerId = null, musicStep = 0, musicNextTime = 0, currentTrackId = null;

function playMusicNote(freq, startTime, dur, wave, vol){
  if(!actx) return;
  const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.type = wave; osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(vol, startTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(startTime); osc.stop(startTime+dur+0.02);
}
function musicScheduler(){
  if(!actx || !soundOn || !currentTrackId){ musicTimerId = setTimeout(musicScheduler, 120); return; }
  const track = MUSIC_TRACKS[currentTrackId];
  const beatDur = 60/track.bpm;
  while(musicNextTime < actx.currentTime + 0.15){
    const noteName = track.notes[musicStep % track.notes.length];
    if(noteName) playMusicNote(NOTE[noteName], musicNextTime, beatDur*0.85, track.wave, 0.045);
    if(track.accent){
      const acc = track.accent[musicStep % track.accent.length];
      if(acc) playMusicNote(NOTE[acc], musicNextTime, beatDur*0.6, 'sine', 0.04);
    }
    if(state.running && state.lives===1){
      playMusicNote(1568, musicNextTime, 0.05, 'square', 0.018);
    }
    musicNextTime += beatDur;
    musicStep++;
  }
  musicTimerId = setTimeout(musicScheduler, 25);
}
function startMusic(trackId){
  ensureAudio(); if(!actx) return;
  currentTrackId = trackId; musicStep = 0; musicNextTime = actx.currentTime + 0.05;
  if(!musicTimerId) musicScheduler();
}
function stopMusic(){ currentTrackId = null; }

// ================= PARTÍCULAS Y CÁMARA (VFX genéricos) =================
const particles = [];
function spawnParticles(x,y,count,cfg){
  for(let i=0;i<count;i++){
    const baseAng = cfg.angle||0, spread = cfg.spread!==undefined?cfg.spread:Math.PI*2;
    const ang = baseAng + (Math.random()-0.5)*spread;
    const spd = (cfg.speedMin||1) + Math.random()*((cfg.speedMax||3)-(cfg.speedMin||1));
    particles.push({
      x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd + (cfg.vyBias||0),
      color: cfg.colors[Math.floor(Math.random()*cfg.colors.length)],
      size: (cfg.sizeMin||3)+Math.random()*((cfg.sizeMax||6)-(cfg.sizeMin||3)),
      grav: cfg.grav!==undefined?cfg.grav:0.15,
      life:0, maxLife: cfg.life||30, shape: cfg.shape||'square'
    });
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.vy += p.grav; p.x+=p.vx; p.y+=p.vy; p.life++;
    if(p.life>p.maxLife) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    const alpha = Math.max(0,1 - p.life/p.maxLife);
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(p.x,p.y);
    ctx.fillStyle=p.color;
    if(p.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    else ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  });
}
let shakeT = 0, shakeMag = 0;
function triggerShake(duration, mag){ shakeT = Math.max(shakeT,duration); shakeMag = mag; }

function spawnSplat(x,y){
  spawnParticles(x,y,10,{colors:['#e8b573','#E85FA0','#fff'],speedMin:1,speedMax:3.5,angle:-Math.PI/2,spread:Math.PI*0.9,vyBias:-1,grav:0.28,life:34,sizeMin:3,sizeMax:6,shape:'circle'});
  triggerShake(10,3);
  sfx.splat();
}
function spawnEnemySplash(x,y,color){
  spawnParticles(x,y,14,{colors:[color,'#fff'],speedMin:1.5,speedMax:4,spread:Math.PI*2,grav:0.2,life:26,sizeMin:3,sizeMax:6,shape:'circle'});
}
function spawnJumpVapor(x,y){
  spawnParticles(x,y,5,{colors:['#ffffff','#e6f7f6'],speedMin:0.3,speedMax:1.2,angle:-Math.PI/2,spread:1.6,grav:-0.02,life:20,sizeMin:3,sizeMax:5,shape:'circle'});
}
function spawnSprinkle(x,y){
  spawnParticles(x,y,1,{colors:CONFETTI_COLORS,speedMin:0.2,speedMax:0.8,angle:Math.PI/2,spread:1.2,grav:0.02,life:18,sizeMin:2,sizeMax:3,shape:'circle'});
}

// ================= PISTAS CONTEXTUALES =================
const state_hint = { text:'', timer:0 };
function showHint(id, text){
  if(hintsSeen[id]) return;
  state_hint.text = text; state_hint.timer = 220;
  markHintSeen(id);
}
function drawHintBanner(){
  if(state_hint.timer<=0) return;
  state_hint.timer--;
  const alpha = state_hint.timer < 30 ? state_hint.timer/30 : 1;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = "600 15px 'Fredoka', sans-serif";
  const tw = ctx.measureText(state_hint.text).width;
  const bx = W/2 - tw/2 - 18, by = 14, bw = tw+36, bh = 34;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#28ACAD'; ctx.lineWidth = 3;
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,17); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh); }
  ctx.fillStyle = '#432919'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(state_hint.text, W/2, by+bh/2+1);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.restore();
}

// ================= PERSONAJES =================
const CHARACTERS = [
  { id:'chalanito', name:'Chalanito\nSiempre Listo', hair:'#4a2f1c', hairStyle:'short', shirt:'#F4F1E6', neck:true, pants:'#c99a52', hat:false, skin:'#f0c8a0' },
  { id:'maestro', name:'Maestro\nTradición', hair:'#4a2f1c', hairStyle:'short', shirt:'#F4F1E6', neck:true, pants:'#F4F1E6', hat:true, hatColor:'#e3c07a', skin:'#f0c8a0' },

function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function updateHearts(maxLives){

function updateTimerHud(){

function gradeRun(mode, tier, livesLost, itemsRatio, elapsedSec){
  const fastT = mode==='climb' ? 12+tier*4 : mode==='maze' ? 18+tier*5 : 20+tier*6;
  if(livesLost===0 && itemsRatio>=0.9 && elapsedSec<=fastT) return {label:'Copa Imperial', emoji:'🏆'};
  if(livesLost<=1 && itemsRatio>=0.6) return {label:'Medalla de Oro', emoji:'🥇'};
  if(livesLost<=2) return {label:'Medalla de Plata', emoji:'🥈'};
  return {label:'Medalla de Bronce', emoji:'🥉'};
}
function finishRun(maxLives, itemsRatio, extraScore, cx, cy){
  const elapsed = (frameT - state.startFrame)/60;
  const livesLost = maxLives - state.lives;
  const timeBonus = Math.max(0, Math.round((40 - elapsed))*4);
  state.score += extraScore + timeBonus;
  syncHud();
  state.lastGrade = gradeRun(selectedMode.id, selectedLevel.tier, livesLost, itemsRatio, elapsed);
  state.lastElapsed = elapsed;
  const best = loadBest(selectedMode.id, selectedLevel.tier);
  state.isNewRecord = !best || state.score > best.score;
  if(state.isNewRecord) saveBest(selectedMode.id, selectedLevel.tier, {score: state.score, grade: state.lastGrade.label});
  spawnCelebration(cx, cy);
}

// ================= DIBUJO DE PERSONAJE (con animación y "derretido" al recibir daño) =================
function drawHumanoid(c,px,py,scale,dir,anim,invuln,pal,moving,jumping){
  c.save();
  c.translate(px,py);
  c.scale(scale,scale);
  const bob = moving ? Math.sin(anim)*2 : Math.sin(anim*0.5)*1;
  const squash = jumping ? -3 : 0;
  c.translate(0,bob+squash);
  if(dir<0){ c.translate(26,0); c.scale(-1,1); }
  let sx=1, sy=1;
  if(invuln>0){
    const meltPulse = Math.abs(Math.sin(invuln*0.5));
    sy = 1 - meltPulse*0.22; sx = 1 + meltPulse*0.16;
    c.translate(13,40); c.scale(sx,sy); c.translate(-13,-40);
    c.globalAlpha = 0.85;
  }

  const legSwing = moving ? Math.sin(anim)*6 : 0;
  c.fillStyle = pal.pants;
  c.fillRect(4,28+Math.max(0,legSwing*0.3),8,9);
  c.fillRect(14,28+Math.max(0,-legSwing*0.3),8,9);
  c.fillStyle = '#241209';
  c.fillRect(4,37,8,3);
  c.fillRect(14,37,8,3);

  if(pal.shirt === 'bare'){
    c.fillStyle = pal.skin;
    c.fillRect(2,14,22,16);
    if(pal.wordmark){ c.fillStyle = '#E40C2C'; c.fillRect(5,21,16,4); }
  } else {
    c.fillStyle = pal.shirt;
    c.fillRect(2,14,22,16);
    if(pal.badge){
      c.fillStyle = '#F4F1E6'; c.beginPath(); c.arc(13,23,5,0,Math.PI*2); c.fill();
      c.fillStyle = '#E40C2C'; c.beginPath(); c.arc(13,23,3,0,Math.PI*2); c.fill();
    }
  }
  c.fillStyle = '#241209'; c.fillRect(2,26,22,2);
  const armSwing = moving ? Math.sin(anim+Math.PI)*3 : 0;
  c.fillStyle = pal.shirt === 'bare' ? pal.skin : pal.shirt;
  c.fillRect(-2,16+armSwing*0.3,6,12); c.fillRect(22,16-armSwing*0.3,6,12);
  if(pal.neck){ c.fillStyle = '#E40C2C'; c.beginPath(); c.moveTo(7,14); c.lineTo(19,14); c.lineTo(13,21); c.closePath(); c.fill(); }
  c.fillStyle = pal.skin; c.fillRect(4,0,18,14);
  c.fillStyle = pal.hair;
  if(pal.hairStyle === 'spiky'){
    c.fillRect(2,-4,22,8);
    for(let i=0;i<4;i++){ c.beginPath(); c.moveTo(4+i*6,-4); c.lineTo(7+i*6,-13); c.lineTo(10+i*6,-4); c.closePath(); c.fill(); }
  } else if(pal.hairStyle === 'bob'){
    c.fillRect(1,-3,24,9); c.fillRect(1,3,5,13); c.fillRect(20,3,5,13);
  } else {
    c.fillRect(2,-3,22,7); c.fillRect(2,2,4,8); c.fillRect(20,2,4,8);
  }
  if(pal.hat){
    c.fillStyle = pal.hatColor; c.fillRect(-1,-9,28,4); c.fillRect(6,-15,14,7);
    c.fillStyle = '#241209'; c.fillRect(-1,-6,28,2);
  }
  c.fillStyle = '#241209'; c.fillRect(9,6,2,3); c.fillRect(16,6,2,3);

  // brillo dorado si no ha recibido daño en este intento
  if(!state.tookDamage && state.running){
    c.save(); c.globalAlpha = 0.35 + Math.sin(frameT*0.15)*0.15;
    c.strokeStyle = '#D9A93B'; c.lineWidth = 1.5;
    c.strokeRect(-3,-6,32,50);
    c.restore();
  }
  c.restore();
}
function drawCoin(c, t){
  ctx.save(); ctx.translate(c.x,c.y);
  const s = Math.abs(Math.sin((t||0)*0.08 + c.x*0.05));
  ctx.scale(0.35+s*0.65, 1);
  ctx.fillStyle = '#e8b573'; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#E85FA0'; ctx.beginPath(); ctx.arc(0,-6,8,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawDiamondBG(scrollX, scrollY){
  const size = 46;
  const cols = ['#28ACAD','#1c8586'];
  ctx.save();
  ctx.translate(-((scrollX*0.3)%(size*2)), -((scrollY*0.3)%(size*2)));
  for(let x=-size*2; x<W+size*4; x+=size){
    for(let y=-size*2; y<160+size*2; y+=size){
      const idx = (Math.round(x/size)+Math.round(y/size))%2;
      ctx.fillStyle = idx===0? cols[0]:cols[1];
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
      ctx.fillRect(-size/2,-size/2,size*0.72,size*0.72);
      ctx.restore();
    }
  }
  ctx.restore();
}
let frameT = 0;

// ================= CELEBRACIÓN DE VICTORIA (helado que explota + tienda que se enciende) =================
function spawnCelebration(x,y){
  state.celebrating = true; state.celebT = 0; state.celebScale = 0;
  state.celebPos = {x,y};
  state.celebParticles = [];
  for(let i=0;i<55;i++){
    const ang = Math.random()*Math.PI*2, spd = 2+Math.random()*5.5;
    state.celebParticles.push({
      x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2.5,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      size: 4+Math.random()*5, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.35
    });
  }
  sfx.pop();
}
function updateCelebration(){
  state.celebT++;
  state.celebScale = Math.min(1.3, state.celebScale + 0.14);
  state.celebParticles.forEach(p=>{ p.vy += 0.12; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; });
  if(state.celebT === 1){ sfx.bell(); }
  if(state.celebT === 14){ sfx.win(); }
  if(state.celebT > 110){ state.celebrating=false; stopMusic(); showScreen('win'); }
}
function drawCelebration(){
  const cx = state.celebPos.x, cy = state.celebPos.y;
  ctx.fillStyle='rgba(44,26,16,0.30)'; ctx.fillRect(0,0,W,H);
  // resplandor pulsante ("la tienda se enciende")
  const glowR = 60 + Math.sin(state.celebT*0.25)*14;
  const grad = ctx.createRadialGradient(cx,cy,4,cx,cy,glowR);
  grad.addColorStop(0,'rgba(217,169,59,0.55)');
  grad.addColorStop(1,'rgba(217,169,59,0)');
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();
  if(state.celebT < 16){
    const s = state.celebScale;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
    ctx.fillStyle='#e8b573'; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.lineTo(0,34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#E85FA0'; ctx.beginPath(); ctx.arc(0,-16,20,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  state.celebParticles.forEach(p=>{
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  });
  if(state.celebT > 10){
    const sc = Math.min(1, (state.celebT-10)/14);
    ctx.save(); ctx.translate(W/2, H/2); ctx.scale(sc,sc);
    ctx.font = "800 46px 'Baloo 2', sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = '#E40C2C'; ctx.fillText('¡FELICIDADES!', 4,4);
    ctx.fillStyle = '#F4F1E6'; ctx.fillText('¡FELICIDADES!', 0,0);
    ctx.restore();
  }
}

// MODO 1: PLATAFORMAS — enemigos "Derretido" (lento) y "Barquillo Travieso" (rápido)
// =====================================================================================
const P = {};
function generatePlatformLevel(tier){
  const t = tier - 1;
  const LEVEL_W = 2000 + t*300;
  const gapCount = 2 + t, gapWidth = 55 + t*7;
  const gaps = [];
  const usable = LEVEL_W - 500, step = usable/(gapCount+1);
  for(let i=1;i<=gapCount;i++){ gaps.push({x: 250 + step*i - gapWidth/2, w: gapWidth}); }
  const platforms = [{x:0,y:GROUND_Y,w:LEVEL_W,h:48}];
  const platCount = 6 + t*2, pStep = (LEVEL_W-500)/platCount;
  const heightVariants = [70,110,150,90,130,60];
  for(let i=0;i<platCount;i++){
    const px = 300 + i*pStep + (i%2===0? 15:55);
    const py = GROUND_Y - heightVariants[i%heightVariants.length] - t*5;
    const pw = Math.max(70, 130 - t*8);
    platforms.push({x:px,y:py,w:pw,h:16});
  }
  const coinsCfg = [];
  platforms.slice(1).forEach(p=>{ coinsCfg.push({x:p.x+p.w/2, y:p.y-24}); });
  for(let x=250;x<LEVEL_W-200;x+=170){ if(!gaps.some(g=>x>g.x-25&&x<g.x+g.w+25)) coinsCfg.push({x,y:GROUND_Y-40}); }
  const obstacleCount = 3 + t*2, obstacles = [], oStep = (LEVEL_W-600)/obstacleCount;
  for(let i=0;i<obstacleCount;i++){
    const ox = 420 + i*oStep, range = 70 + t*12;
    const isBarquillo = t>=2 && i%2===1;
    const speed = isBarquillo ? (1.8 + t*0.5) : (0.9 + t*0.2);
    obstacles.push({x:ox,y:GROUND_Y-22,w:24,h:22,dir:i%2===0?1:-1,min:ox-range,max:ox+range,dead:false,speed,kind:isBarquillo?'barquillo':'derretido'});
  }
  const goal = {x:LEVEL_W-170,y:GROUND_Y-150,w:80,h:150};
  const lives = Math.max(3, 5 - Math.floor(t/2));
  return { LEVEL_W, platforms, gaps, coinsCfg, obstacles, goal, lives };
}
function initPlatform(tier){
  P.cur = generatePlatformLevel(tier);
  P.coins = P.cur.coinsCfg.map(c=>({...c, taken:false}));
  P.obstacles = P.cur.obstacles.map(o=>({...o}));
  P.player = { x:40, y:GROUND_Y-40, w:26, h:40, vx:0, vy:0, onGround:false, dir:1, anim:0, invuln:90 };
  state.lives = P.cur.lives;
  showHint('platform','¡Usa ESPACIO o ▲ para saltar los huecos!');
}
function inGapP(px){ return P.cur.gaps.some(g => px > g.x && px < g.x+g.w); }
function updatePlatform(){
  const pl = P.player;
  pl.vx = 0;
  if(state.keys['left']){ pl.vx=-SPEED; pl.dir=-1; }
  if(state.keys['right']){ pl.vx=SPEED; pl.dir=1; }
  if(state.keys['jump'] && pl.onGround){ pl.vy=JUMP_V; pl.onGround=false; sfx.jump(); spawnJumpVapor(pl.x+13,pl.y+40); }
  pl.vy += GRAVITY; pl.x += pl.vx; pl.y += pl.vy;
  pl.x = Math.max(0, Math.min(P.cur.LEVEL_W-pl.w, pl.x));
  pl.onGround = false;
  const footY = pl.y + pl.h;
  for(const p of P.cur.platforms){
    if(p.y === GROUND_Y && inGapP(pl.x + pl.w/2)) continue;
    if(pl.x+pl.w > p.x && pl.x < p.x+p.w){
      if(footY >= p.y && footY <= p.y+18 && pl.vy >= 0){ pl.y = p.y-pl.h; pl.vy=0; pl.onGround=true; }
    }
  }
  if(pl.y > H+60){ loseLife(P.cur.lives); }
  if(pl.invuln>0) pl.invuln--;
  pl.anim += Math.abs(pl.vx)>0 ? 0.25 : 0.06;

  for(const c of P.coins){
    if(c.taken) continue;
    const dx=(pl.x+pl.w/2)-c.x, dy=(pl.y+pl.h/2)-c.y;
    if(Math.sqrt(dx*dx+dy*dy) < 26){
      c.taken=true; state.coins++; state.score+=50; sfx.coin(); syncHud();
      state.streak++;
      if(state.streak>=3) spawnSprinkle(pl.x+13,pl.y+20);
    }
  }
  for(const e of P.obstacles){
    if(e.dead) continue;
    e.x += e.dir*e.speed;
    if(e.x<e.min || e.x>e.max) e.dir*=-1;
    if(rectsOverlap(pl,e) && pl.invuln<=0){
      if(pl.vy>2 && (pl.y+pl.h) < e.y+e.h*0.6){
        e.dead=true; pl.vy=-7; state.score+=100; sfx.hit(); syncHud();
        spawnEnemySplash(e.x+e.w/2,e.y+e.h/2, e.kind==='barquillo'?'#e8b573':'#c98a4a');
      }
      else { loseLife(P.cur.lives); }
    }
  }
  if(rectsOverlap(pl, P.cur.goal) && !state.won){
    state.won = true;
    finishRun(P.cur.lives, P.coins.length? state.coins/P.coins.length : 1, 500 + selectedLevel.tier*100, pl.x - state.camX, pl.y - 20);
  }
  state.camX = Math.max(0, Math.min(P.cur.LEVEL_W-W, pl.x - W/2));
}
function drawPlatform(){
  drawDiamondBG(state.camX, 0);
  ctx.fillStyle = 'rgba(244,241,230,0.55)'; ctx.fillRect(0,150,W,H-150);
  ctx.save(); ctx.translate(-state.camX,0);
  P.cur.platforms.forEach(p=>{
    if(p.y === GROUND_Y){
      const sortedGaps = P.cur.gaps.filter(g=>g.x<p.x+p.w && g.x+g.w>p.x).sort((a,b)=>a.x-b.x);
      let cursor = p.x;
      sortedGaps.forEach(g=>{ groundSeg(cursor,g.x-cursor); cursor=g.x+g.w; });
      groundSeg(cursor,p.x+p.w-cursor);
    } else {
      ctx.fillStyle = '#CEC988'; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle = '#E40C2C'; ctx.fillRect(p.x,p.y,p.w,4);
    }
  });
  function groundSeg(x,w){
    if(w<=0) return;
    ctx.fillStyle = '#432919'; ctx.fillRect(x,GROUND_Y,w,H-GROUND_Y);
    ctx.fillStyle = '#E40C2C'; ctx.fillRect(x,GROUND_Y,w,6);
  }
  P.coins.forEach(c=>{ if(!c.taken) drawCoin(c, frameT); });
  P.obstacles.forEach(e=>{ if(!e.dead) drawObstacle(e); });
  const g = P.cur.goal;
  ctx.fillStyle = '#432919'; ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.fillStyle = '#E40C2C'; ctx.fillRect(g.x-8,g.y-16,g.w+16,20);
  ctx.fillStyle = '#CEC988'; ctx.fillRect(g.x+8,g.y+34,g.w-16,g.h-44);
  ctx.fillStyle = '#F4F1E6'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign='center';
  ctx.fillText('EL CHALÁN', g.x+g.w/2, g.y-2); ctx.textAlign='left';
  const pl = P.player;
  drawHumanoid(ctx, pl.x, pl.y, 1, pl.dir, pl.anim, pl.invuln, selectedChar, Math.abs(pl.vx)>0, pl.vy<-1);
  ctx.restore();
}
function drawObstacle(e){
  ctx.save(); ctx.translate(e.x,e.y);
  if(e.kind === 'barquillo'){
    // Barquillo Travieso: cono rodante con textura de barquillo
    ctx.rotate((frameT*0.15*e.dir));
    ctx.fillStyle = '#e8b573';
    ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(11,10); ctx.lineTo(-11,10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c98a4a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-8,2); ctx.lineTo(8,-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,7); ctx.lineTo(9,0); ctx.stroke();
  } else {
    // Derretido: charco lento derritiéndose
    ctx.fillStyle = '#c98a4a';
    ctx.beginPath();
    ctx.ellipse(e.w/2,e.h*0.7,e.w/2+2,e.h*0.35,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8b573';
    ctx.beginPath(); ctx.ellipse(e.w/2,e.h*0.35,e.w/2-3,e.h*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#432919';
    ctx.fillRect(e.w*0.28,e.h*0.28,3,3); ctx.fillRect(e.w*0.62,e.h*0.28,3,3);
  }
  ctx.restore();
}

// MODO 2: ESCALADA — Nube de Azúcar activa (se mueve y lanza las bochas)
// =====================================================================================
const K = {};
const ROWH = 70, CLIMB_GROUND_Y = 320;
function generateClimbLevel(tier){
  const t = tier - 1;
  const rowCount = 5 + t;
  const rows = [];
  for(let i=0;i<rowCount;i++){
    const y = CLIMB_GROUND_Y - i*ROWH;
    const gapSide = i % 2 === 0 ? 'right' : 'left';
    const gapX = gapSide === 'right' ? W-140 : 60;
    rows.push({ y, gapX, gapW: 80, top: i===rowCount-1 });
  }
  const spawnInterval = Math.max(38, 95 - t*13);
  const baseSpeed = 1.4 + t*0.35;
  const lives = Math.max(2, 4 - Math.floor(t/2));
  return { rows, spawnInterval, baseSpeed, lives };
}
function initClimb(tier){
  K.cfg = generateClimbLevel(tier);
  K.rows = K.cfg.rows;
  K.player = { x:60, y: K.rows[0].y-40, w:24, h:36, dir:1, anim:0, invuln:60, row:0, climbing:false };
  K.obstacles = [];
  K.spawnTimer = 0;
  K.cloudPhase = 0;
  state.lives = K.cfg.lives;
  showHint('climb','¡Usa ↑ y ↓ en las escaleras para trepar!');
}
function rowAt(i){ return K.rows[Math.max(0,Math.min(K.rows.length-1,i))]; }
function cloudX(){
  const topRow = K.rows[K.rows.length-1];
  return W/2 + Math.sin(K.cloudPhase)*(W/2-100);
}
function updateClimb(){
  const pl = K.player;
  const row = rowAt(pl.row);
  const aboveRow = rowAt(pl.row+1);
  const belowRow = rowAt(pl.row-1);
  const onLadderUp = Math.abs((pl.x+pl.w/2) - row.gapX) < row.gapW/2;
  const onLadderDown = pl.row>0 && Math.abs((pl.x+pl.w/2) - belowRow.gapX) < belowRow.gapW/2;

  pl.climbing = false;
  const moving = !!(state.keys['left'] || state.keys['right']);
  if(state.keys['left']){ pl.x -= SPEED; pl.dir=-1; }
  if(state.keys['right']){ pl.x += SPEED; pl.dir=1; }
  pl.x = Math.max(10, Math.min(W-10-pl.w, pl.x));

  if(state.keys['up'] && onLadderUp && pl.row < K.rows.length-1){
    pl.y -= 2.6; pl.climbing = true;
    if(pl.y <= aboveRow.y - pl.h){ pl.row += 1; pl.y = rowAt(pl.row).y - pl.h; }
  } else if(state.keys['down'] && onLadderDown && pl.row > 0){
    pl.y += 2.6; pl.climbing = true;
    if(pl.y >= belowRow.y - pl.h){ pl.row -= 1; pl.y = rowAt(pl.row).y - pl.h; }
  } else {
    pl.y = row.y - pl.h;
  }
  if(pl.climbing && frameT % 8 === 0) sfx.climb();
  pl.anim += (moving || pl.climbing) ? 0.25 : 0.06;
  if(pl.invuln>0) pl.invuln--;

  K.cloudPhase += 0.012;

  K.spawnTimer++;
  if(K.spawnTimer > K.cfg.spawnInterval){
    K.spawnTimer = 0;
    const topRow = K.rows.length-1;
    K.obstacles.push({ row: topRow, x: cloudX(), y: rowAt(topRow).y-30, dir: Math.random()<0.5?-1:1, speed:K.cfg.baseSpeed, state:'rolling' });
  }
  for(const o of K.obstacles){
    if(o.state === 'rolling'){
      o.x += o.dir*o.speed;
      const r = rowAt(o.row);
      if(o.x < 30) o.dir = 1;
      if(o.x > W-30) o.dir = -1;
      if(Math.abs(o.x - r.gapX) < 10 && o.row > 0){ o.state='falling'; }
      o.y = r.y - 14;
    } else if(o.state === 'falling'){
      o.y += 4.5;
      const below = rowAt(o.row-1);
      if(o.y >= below.y - 14){ o.row -= 1; o.state = o.row>0 ? 'rolling' : 'gone'; o.dir = Math.random()<0.5?-1:1; }
    }
  }
  K.obstacles = K.obstacles.filter(o=>o.state!=='gone');

  for(const o of K.obstacles){
    const dx = (pl.x+pl.w/2)-o.x, dy=(pl.y+pl.h/2)-o.y;
    if(Math.sqrt(dx*dx+dy*dy) < 20 && pl.invuln<=0){ loseLifeClimb(); }
  }

  const worldTop = K.rows[K.rows.length-1].y - 90;
  const worldBottom = K.rows[0].y + 60;
  let cam = pl.y - H/2;
  const camMax = Math.max(worldTop, worldBottom - H);
  cam = Math.max(worldTop, Math.min(cam, camMax));
  state.camY = cam;

  if(row.top && !state.won){
    state.won = true;
    finishRun(K.cfg.lives, 1, 800 + selectedLevel.tier*100, pl.x, pl.y - state.camY - 20);
  }
}
function loseLifeClimb(){
  state.lives -= 1; state.tookDamage = true; syncHud(); sfx.hit();
  spawnSplat(K.player.x+12, K.player.y - state.camY + 18);
  state.streak = 0;
  if(state.lives <= 0){ stopMusic(); state.lost = true; showScreen('lose'); }
  else { K.player.row = 0; K.player.x = 60; K.player.y = K.rows[0].y-40; K.player.invuln = 90; }
}
function drawClimb(){
  drawDiamondBG(0, state.camY);
  ctx.fillStyle = 'rgba(244,241,230,0.5)'; ctx.fillRect(0,150,W,H-150);
  ctx.save(); ctx.translate(0, -state.camY);
  K.rows.forEach((r,i)=>{
    ctx.fillStyle = r.top ? '#432919' : '#CEC988';
    ctx.fillRect(0, r.y, W, 14);
    ctx.fillStyle = '#E40C2C'; ctx.fillRect(0, r.y, W, 4);
    ctx.fillStyle = 'rgba(244,241,230,0.9)';
    ctx.fillRect(r.gapX-r.gapW/2, r.y, r.gapW, 14);
    if(i < K.rows.length-1){
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 4;
      for(let lx=-14; lx<=14; lx+=28){
        ctx.beginPath(); ctx.moveTo(r.gapX+lx, r.y); ctx.lineTo(r.gapX+lx, r.y-ROWH); ctx.stroke();
      }
      for(let ly=0; ly<=ROWH; ly+=14){
        ctx.beginPath(); ctx.moveTo(r.gapX-14, r.y-ly); ctx.lineTo(r.gapX+14, r.y-ly); ctx.stroke();
      }
    }
  });
  // Nube de Azúcar (reemplaza al carrito estático, se mueve y "lanza")
  const top = K.rows[K.rows.length-1];
  const ncx = cloudX(), ncy = top.y-60;
  ctx.save(); ctx.translate(ncx,ncy);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-20,0,18,0,Math.PI*2); ctx.arc(0,-10,22,0,Math.PI*2); ctx.arc(20,0,18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#432919';
  ctx.fillRect(-10,-6,4,4); ctx.fillRect(6,-6,4,4);
  ctx.restore();
  ctx.fillStyle = '#F4F1E6'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('EL CHALÁN', W/2, top.y-100); ctx.textAlign='left';

  K.obstacles.forEach(o=>{
    ctx.save(); ctx.translate(o.x,o.y);
    ctx.fillStyle = '#ff8fa8'; ctx.beginPath(); ctx.arc(0,-6,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8b573'; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.lineTo(0,16); ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  const pl = K.player;
  drawHumanoid(ctx, pl.x, pl.y, 1, pl.dir, pl.anim, pl.invuln, selectedChar, true, false);
  ctx.restore();
}

// =====================================================================================
const MZ = {};
function buildMaze(cols, rows){
  const walls = [];
  for(let r=0;r<rows;r++){
    const row = [];
    for(let c=0;c<cols;c++){
      let wall = (r===0 || r===rows-1 || c===0 || c===cols-1);
      if(!wall && r%2===0 && c%3===0 && r>1 && r<rows-2 && c>1 && c<cols-2) wall = true;
      row.push(wall);
    }
    walls.push(row);
  }
  return walls;
}
function generateMazeLevel(tier){
  const t = tier - 1;
  const cols = 16 + t*2, rows = 7 + t;
  const tileW = W/cols, tileH = H/rows;
  const patrolCount = 1 + t;
  const speed = 1.3 + t*0.32;
  const lives = Math.max(2, 4 - Math.floor(t/2));
  return { cols, rows, tileW, tileH, patrolCount, speed, lives };
}
function isWallMZ(px,py){
  const c = Math.floor(px/MZ.cfg.tileW), r = Math.floor(py/MZ.cfg.tileH);
  if(r<0||r>=MZ.cfg.rows||c<0||c>=MZ.cfg.cols) return true;
  return MZ.walls[r][c];
}
function canMoveMZ(x,y,w,h,dx,dy){
  const nx = x+dx, ny = y+dy;
  const pts = [[nx,ny],[nx+w,ny],[nx,ny+h],[nx+w,ny+h]];
  return !pts.some(p=>isWallMZ(p[0],p[1]));
}
function initMaze(tier){
  MZ.cfg = generateMazeLevel(tier);
  MZ.walls = buildMaze(MZ.cfg.cols, MZ.cfg.rows);
  MZ.dots = [];
  for(let r=1;r<MZ.cfg.rows-1;r++) for(let c=1;c<MZ.cfg.cols-1;c++){
    if(!MZ.walls[r][c] && !(r===1&&c===1)) MZ.dots.push({r,c,taken:false});
  }
  const pw = MZ.cfg.tileW*0.55, ph = MZ.cfg.tileH*0.75;
  MZ.player = { x: 1.5*MZ.cfg.tileW - pw/2, y: 1.5*MZ.cfg.tileH - ph/2, w:pw, h:ph, dir:{x:0,y:0}, want:{x:0,y:0}, anim:0 };
  const anchors = [
    {c:MZ.cfg.cols-2,r:MZ.cfg.rows-2}, {c:MZ.cfg.cols-2,r:1}, {c:1,r:MZ.cfg.rows-2},
    {c:Math.floor(MZ.cfg.cols/2),r:1}, {c:Math.floor(MZ.cfg.cols/2),r:MZ.cfg.rows-2}
  ];
  MZ.patrols = [];
  for(let i=0;i<MZ.cfg.patrolCount;i++){
    const a = anchors[i % anchors.length];
    MZ.patrols.push({ x:a.c*MZ.cfg.tileW+MZ.cfg.tileW/2-10, y:a.r*MZ.cfg.tileH+MZ.cfg.tileH/2-10, dir:{x: i%2===0?-1:0, y:i%2===0?0:1}, speed: MZ.cfg.speed, hue: i%3 });
  }
  state.lives = MZ.cfg.lives;
  state.dotsTotal = MZ.dots.length;
  showHint('maze','¡Recoge todas las grageas y esquiva a las Chispas Pícaras!');
}
function moveEntityMZ(e, dirVec, speed, w, h){
  const dx = dirVec.x*speed, dy = dirVec.y*speed;
  if(dx!==0 && canMoveMZ(e.x,e.y,w,h,dx,0)) e.x += dx;
  else if(dy!==0 && canMoveMZ(e.x,e.y,w,h,0,dy)) e.y += dy;
}
function updateMaze(){
  const pl = MZ.player;
  if(state.keys['left']) pl.want = {x:-1,y:0};
  else if(state.keys['right']) pl.want = {x:1,y:0};
  else if(state.keys['up']) pl.want = {x:0,y:-1};
  else if(state.keys['down']) pl.want = {x:0,y:1};

  const spd = 3;
  const tryDx = pl.want.x*spd, tryDy = pl.want.y*spd;
  if((tryDx!==0||tryDy!==0) && canMoveMZ(pl.x,pl.y,pl.w,pl.h,tryDx,tryDy)){ pl.dir = pl.want; }
  const dx = pl.dir.x*spd, dy = pl.dir.y*spd;
  if(canMoveMZ(pl.x,pl.y,pl.w,pl.h,dx,dy)){ pl.x += dx; pl.y += dy; }
  pl.anim += (pl.dir.x||pl.dir.y) ? 0.3 : 0.05;

  for(const d of MZ.dots){
    if(d.taken) continue;
    const dcx = d.c*MZ.cfg.tileW+MZ.cfg.tileW/2, dcy = d.r*MZ.cfg.tileH+MZ.cfg.tileH/2;
    if(Math.abs((pl.x+pl.w/2)-dcx)<14 && Math.abs((pl.y+pl.h/2)-dcy)<14){
      d.taken=true; state.coins++; state.score+=20; sfx.dot(); syncHud();
      state.streak++;
      if(state.streak>=3) spawnSprinkle(pl.x+pl.w/2,pl.y+pl.h/2);
    }
  }
  const remaining = MZ.dots.some(d=>!d.taken);
  if(!remaining && !state.won){
    state.won = true;
    finishRun(MZ.cfg.lives, state.dotsTotal? state.coins/state.dotsTotal : 1, 400 + selectedLevel.tier*80, pl.x+pl.w/2, pl.y+pl.h/2);
  }

  MZ.patrols.forEach(pt=>{
    if(Math.random()<0.02 || !canMoveMZ(pt.x,pt.y,20,20,pt.dir.x*pt.speed,pt.dir.y*pt.speed)){
      const opts = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>canMoveMZ(pt.x,pt.y,20,20,d.x*pt.speed,d.y*pt.speed));
      if(opts.length) pt.dir = opts[Math.floor(Math.random()*opts.length)];
    }
    moveEntityMZ(pt, pt.dir, pt.speed, 20, 20);
    const dx=(pl.x+pl.w/2)-(pt.x+10), dy=(pl.y+pl.h/2)-(pt.y+10);
    if(Math.sqrt(dx*dx+dy*dy) < 20){ loseLifeMaze(); }
  });
}
function loseLifeMaze(){
  state.lives -= 1; state.tookDamage = true; syncHud(); sfx.hit();
  spawnSplat(MZ.player.x+MZ.player.w/2, MZ.player.y+MZ.player.h/2);
  state.streak = 0;
  if(state.lives<=0){ stopMusic(); state.lost=true; showScreen('lose'); }
  else { MZ.player.x = 1.5*MZ.cfg.tileW - MZ.player.w/2; MZ.player.y = 1.5*MZ.cfg.tileH - MZ.player.h/2; MZ.player.dir={x:0,y:0}; }
}
function drawMaze(){
  ctx.fillStyle = '#0d2b2b'; ctx.fillRect(0,0,W,H);
  const cols = MZ.cfg.cols, rows = MZ.cfg.rows, tileW = MZ.cfg.tileW, tileH = MZ.cfg.tileH;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(MZ.walls[r][c]){
      ctx.fillStyle = '#28ACAD';
      ctx.fillRect(c*tileW+1, r*tileH+1, tileW-2, tileH-2);
    }
  }
  MZ.dots.forEach(d=>{
    if(d.taken) return;
    ctx.fillStyle = '#F4F1E6';
    ctx.beginPath(); ctx.arc(d.c*tileW+tileW/2, d.r*tileH+tileH/2, Math.min(tileW,tileH)*0.12, 0, Math.PI*2); ctx.fill();
  });
  const hues = ['#E40C2C','#E85FA0','#D9A93B'];
  MZ.patrols.forEach(pt=>{
    ctx.save(); ctx.translate(pt.x+10,pt.y+10);
    ctx.rotate(frameT*0.2);
    ctx.fillStyle = hues[pt.hue||0];
    for(let i=0;i<4;i++){
      ctx.save(); ctx.rotate(i*Math.PI/2);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(4,-10); ctx.lineTo(0,-14); ctx.lineTo(-4,-10); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
  const pl = MZ.player;
  drawHumanoid(ctx, pl.x-2, pl.y-16, 0.85, pl.dir.x<0?-1:1, pl.anim, 0, selectedChar, !!(pl.dir.x||pl.dir.y), false);
}

function syncHud(){
  document.getElementById('coins').textContent = state.coins;
  document.getElementById('score').textContent = state.score;
}
function loseLife(maxLives){
  state.lives -= 1; state.tookDamage = true; syncHud(); sfx.hit(); updateHearts(maxLives);
  spawnSplat(P.player.x+13, P.player.y+30);
  state.streak = 0;
  if(state.lives <= 0){ stopMusic(); state.lost = true; showScreen('lose'); }
  else { P.player.x = 40; P.player.y = GROUND_Y-40; P.player.vx=0; P.player.vy=0; P.player.invuln=90; }
}

function update(){
  frameT++;
  updateParticles();
  if(!state.running) return;
  if(state.celebrating){ updateCelebration(); return; }
  updateTimerHud();
  if(selectedMode.id === 'platform'){ updatePlatform(); updateHearts(P.cur.lives); }
  else if(selectedMode.id === 'climb'){ updateClimb(); updateHearts(K.cfg.lives); }
  else { updateMaze(); updateHearts(MZ.cfg.lives); }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#bfe7e6'; ctx.fillRect(0,0,W,H);
  let sx=0, sy=0;
  if(shakeT>0){ sx=(Math.random()-0.5)*shakeMag; sy=(Math.random()-0.5)*shakeMag; shakeT--; }
  ctx.save(); ctx.translate(sx,sy);
  if(selectedMode.id === 'platform'){ if(P.cur) drawPlatform(); }
  else if(selectedMode.id === 'climb'){ if(K.rows) drawClimb(); }
  else { if(MZ.walls) drawMaze(); }
  drawParticles();
  ctx.restore();
  if(state.celebrating) drawCelebration();
  drawHintBanner();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

function starsHtml(tier){ let out=''; for(let i=1;i<=5;i++){ out+=`<span class="${i<=tier?'':'off'}">★</span>`; } return out; }

function updateControlsVisibility(){
  const jumpBtn = document.getElementById('btnJump');
  const upBtn = document.getElementById('btnUp');
  const downBtn = document.getElementById('btnDown');
  if(selectedMode.id === 'platform'){ jumpBtn.classList.remove('hide'); upBtn.classList.add('hide'); downBtn.classList.add('hide'); }
  else { jumpBtn.classList.add('hide'); upBtn.classList.remove('hide'); downBtn.classList.remove('hide'); }
}

function showScreen(kind){
  state.running = false;
  if(kind !== 'win' && kind !== 'lose') stopMusic();
  const screen = document.getElementById('screen');
  screen.classList.remove('hidden');

  if(kind === 'menu'){
    screen.innerHTML = `
      <div class="caption-pill pillfont">En el Dulce Pueblo...</div>
      <h1 class="titlefont">El Legado</h1>
      <div class="hand handfont">¡El sabor tradicional, ahora en un videojuego!</div>
      <p>Elige a tu personaje del Dulce Pueblo, escoge un modo de juego y un nivel de dificultad, y ayúdalo a llegar hasta la heladería.</p>
      <button class="pixel" id="toSelectBtn">Elegir personaje</button>`;
    document.getElementById('toSelectBtn').onclick = ()=>{ ensureAudio(); sfx.select(); showScreen('select'); };
    return;
  }

  if(kind === 'select'){
    let cards = CHARACTERS.map(cfg=>`
      <div class="charcard ${cfg===selectedChar?'selected':''}" data-id="${cfg.id}">
        <canvas width="60" height="60" data-preview="${cfg.id}"></canvas>
        <div class="cname">${cfg.name.replace('\n','<br>')}</div>
      </div>`).join('');
    screen.innerHTML = `<h1 class="titlefont small">Elige tu personaje</h1><div class="rowcards">${cards}</div><button class="pixel" id="toModeBtn">Siguiente</button>`;
    document.querySelectorAll('.charcard').forEach(card=>{
      card.addEventListener('click', ()=>{
        sfx.select();
        selectedChar = CHARACTERS.find(c=>c.id===card.dataset.id);
        document.querySelectorAll('.charcard').forEach(cc=>cc.classList.remove('selected'));
        card.classList.add('selected');
      });
    });
    document.querySelectorAll('canvas[data-preview]').forEach(cv=>{
      const cfg = CHARACTERS.find(c=>c.id===cv.dataset.preview);
      drawHumanoid(cv.getContext('2d'), 15, 16, 1.1, 1, 0, 0, cfg, false, false);
    });
    document.getElementById('toModeBtn').onclick = ()=>{ sfx.select(); showScreen('modeselect'); };
    return;
  }

  if(kind === 'modeselect'){
    let cards = MODES.map(m=>`
      <div class="modecard ${m===selectedMode?'selected':''}" data-id="${m.id}">
        <div class="micon">${m.icon}</div>
        <div class="mname">${m.name}</div>
        <div class="mdesc">${m.desc.replace('\n','<br>')}</div>
      </div>`).join('');
    screen.innerHTML = `<h1 class="titlefont small">Elige el modo de juego</h1><div class="rowcards">${cards}</div><button class="pixel" id="modeNextBtn">Siguiente</button>`;
    document.querySelectorAll('.modecard').forEach(card=>{
      card.addEventListener('click', ()=>{
        sfx.select();
        selectedMode = MODES.find(m=>m.id===card.dataset.id);
        document.querySelectorAll('.modecard').forEach(cc=>cc.classList.remove('selected'));
        card.classList.add('selected');
      });
    });
    document.getElementById('modeNextBtn').onclick = ()=>{ sfx.select(); showScreen('levelselect'); };
    return;
  }

  if(kind === 'levelselect'){
    let cards = LEVELS.map(lv=>{
      const best = loadBest(selectedMode.id, lv.tier);
      return `
      <div class="levelcard ${lv===selectedLevel?'selected':''}" data-tier="${lv.tier}">
        <div class="lname">${lv.name}</div>
        <div class="ldesc">${lv.tag}</div>
        <div class="stars">${starsHtml(lv.tier)}</div>
        ${best? `<div class="best">Mejor: ${best.score} pts</div>` : ''}
      </div>`;
    }).join('');
    screen.innerHTML = `<h1 class="titlefont small">Nivel de dificultad — ${selectedMode.name}</h1><div class="levelcards">${cards}</div><button class="pixel" id="startBtn">Start</button>`;
    document.querySelectorAll('.levelcard').forEach(card=>{
      card.addEventListener('click', ()=>{
        sfx.select();
        selectedLevel = LEVELS.find(l=>l.tier===Number(card.dataset.tier));
        document.querySelectorAll('.levelcard').forEach(cc=>cc.classList.remove('selected'));
        card.classList.add('selected');
      });
    });
    document.getElementById('startBtn').onclick = startGame;
    return;
  }

  if(kind === 'win'){
    const extra = selectedMode.id==='maze' ? `Grageas recogidas: ${state.coins}/${state.dotsTotal}.` : `Helados recogidos: ${state.coins}.`;
    const grade = state.lastGrade || {label:'Medalla de Bronce',emoji:'🥉'};
    const quote = WIN_QUOTES[selectedChar.id] || '¡Muchas gracias!';
    const recordLine = state.isNewRecord ? `<div class="record">🌟 ¡Nuevo récord en ${selectedMode.name} — ${selectedLevel.name}!</div>` : '';
    screen.innerHTML = `<div class="medal">${grade.emoji}</div><div class="medalname">${grade.label}</div>
      <h1 class="titlefont">¡Muchas gracias!</h1>
      <div class="hand handfont">${quote}</div>
      ${recordLine}
      <p>${extra} Puntaje: ${state.score} — ${selectedMode.name} (${selectedLevel.name}). Tiempo: ${Math.floor(state.lastElapsed||0)}s.<br>El sabor de siempre, ahora en tus manos.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;"><button class="pixel" id="restartBtn">Repetir</button><button class="pixel teal" id="nextLevelBtn">Elegir nivel</button><button class="pixel ghost" id="changeCharBtn">Cambiar modo</button></div>`;
    document.getElementById('nextLevelBtn').onclick = ()=>showScreen('levelselect');
    document.getElementById('changeCharBtn').onclick = ()=>showScreen('modeselect');
  } else if(kind === 'lose'){
    sfx.lose();
    screen.innerHTML = `<h1 class="titlefont small" style="text-shadow:3px 3px 0 var(--brown);">Se acabaron<br>tus corazones</h1><p>Puntaje final: ${state.score} — ${selectedMode.name} (${selectedLevel.name}).</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;"><button class="pixel" id="restartBtn">Reintentar</button><button class="pixel teal" id="nextLevelBtn">Elegir nivel</button><button class="pixel ghost" id="changeCharBtn">Cambiar modo</button></div>`;
    document.getElementById('nextLevelBtn').onclick = ()=>showScreen('levelselect');
    document.getElementById('changeCharBtn').onclick = ()=>showScreen('modeselect');
  }
  document.getElementById('restartBtn').onclick = startGame;
}

function startGame(){
  ensureAudio();
  startMusic(selectedMode.id);
  state.coins=0; state.score=0; state.won=false; state.lost=false; state.celebrating=false;
  state.streak=0; state.tookDamage=false; state.startFrame=frameT; state.lastGrade=null; state.isNewRecord=false;
  particles.length = 0;
  syncHud();
  updateControlsVisibility();
  if(selectedMode.id === 'platform'){ initPlatform(selectedLevel.tier); updateHearts(P.cur.lives); }
  else if(selectedMode.id === 'climb'){ initClimb(selectedLevel.tier); updateHearts(K.cfg.lives); }
  else { initMaze(selectedLevel.tier); updateHearts(MZ.cfg.lives); }
  document.getElementById('screen').classList.add('hidden');
  state.running = true;
}

showScreen('menu');

window.addEventListener('keydown', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) state.keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) state.keys.right = true;
  if(['ArrowUp','w','W'].includes(e.key)) state.keys.up = true;
  if(['ArrowDown','s','S'].includes(e.key)) state.keys.down = true;
  if([' '].includes(e.key)) state.keys.jump = true;
});
window.addEventListener('blur', ()=>{ Object.keys(state.keys).forEach(k=>state.keys[k]=false); });
window.addEventListener('keyup', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) state.keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) state.keys.right = false;
  if(['ArrowUp','w','W'].includes(e.key)) state.keys.up = false;
  if(['ArrowDown','s','S'].includes(e.key)) state.keys.down = false;
  if([' '].includes(e.key)) state.keys.jump = false;
});
function bindHold(id, key){
  const el = document.getElementById(id);
  const on = ev=>{ ev.preventDefault(); state.keys[key]=true; };
  const off = ev=>{ ev.preventDefault(); state.keys[key]=false; };
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off,{passive:false}); el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off);
}
bindHold('btnLeft','left');
bindHold('btnRight','right');
bindHold('btnUp','up');
bindHold('btnDown','down');
bindHold('btnJump','jump');
updateControlsVisibility();

loop();
</script>
</body>
</html>
